version: 2.1

parameters:
  image-tag:
    type: string
    default: "ci-<<pipeline.number>>"

jobs:
  build:
    machine:
      image: ubuntu-2204:current
      #docker_layer_caching: true
    resource_class: large
    steps:
      - checkout
      - run: |
          sudo apt update
      - run: |
          sudo apt-get install -y docker-buildx-plugin
      - run: |
          echo "$CODEBERG_ACCESS_KEY" | docker login -u seungjin --password-stdin codeberg.org
      #- run: |
      #    docker build --platform linux/amd64 -t codeberg.org/sa/mstd-random-cafe:<<pipeline.parameters.image-tag>> .
      #- run: |
      #    docker push codeberg.org/sa/mstd-random-cafe::<<pipeline.parameters.image-tag>>
      #- run: |
      #    docker tag codeberg.org/sa/mstd-random-cafe::<<pipeline.parameters.image-tag>> codeberg.org/sa/mstd-random-cafe:latest
      #- run: |
      #    docker push codeberg.org/sa/mstd-random-cafe:latest
      - run: |
          docker buildx build 
          --platform linux/amd64,linux/aarch64 
          -t codeberg.org/sa/mstd-random-cafe:<<pipeline.parameters.image-tag>> 
          --push .





































