version: 2.1
jobs:
  build:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    resource_class: large
    steps:
      - checkout
      - apt:
          pkg:
            - docker-buildx-plugin
          state: latest
          update_cache: true
      - run: |
          docker buildx build --platform linux/amd64,linux/aarch64 -t codeberg.org/sa/mstd-random-restaurant:lates$





































