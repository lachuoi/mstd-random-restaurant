[package]
name = "mstd-random-restaurant"
version = "0.1.0"
edition = "2024"
authors = ["Seungjin Kim <seungjin@duck.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
log = "0.4"
serde_yaml = "0"
rand = { version = "0.8", features = ["small_rng"] }
serde_json = "1"
csv = "1.1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
anyhow = "1"
wasi = "0.13.1"
futures = "0.3"
url = "2.5.4"
urlencoding = "2"
async-recursion = "1"
base64 = "0.21"

[package.metadata.component]
package = "component:mstd-random-restaurant"

[profile.release]
panic = 'abort'
strip = true
opt-level = "z"
lto = true
